<!doctype html><meta charset=utf-8><link rel=stylesheet href=base.css><link rel=stylesheet href=cd.css><script src=players.js></script>
<style>
.banner{background:var(--red);color:#fff;text-align:center;padding:12px 10px 10px;box-shadow:var(--shadow)}
.banner h1{font-family:Oswald;font-size:32px}.count{font-family:Oswald;font-size:54px;color:var(--yellow);line-height:1}
.bar{height:8px;background:#5b1f1e;margin-top:6px}.bar i{display:block;height:100%;width:62%;background:var(--yellow)}
.hint{color:#f7e9ca;text-align:center;font-size:14.5px;margin:9px 14px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px}
.p{background:var(--paper-light);box-shadow:var(--shadow);text-align:center;padding:7px 4px 6px;position:relative;min-height:84px}
.p .n{position:absolute;top:3px;left:6px;font-family:Oswald;font-size:17px;color:var(--red)}
.p .a{width:38px;height:38px;border-radius:50%;margin:2px auto 4px}
.p .m{font:700 12px "Courier Prime";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p.sel{outline:4px solid var(--red)}.p.sel:after{content:"✓ YOUR VOTE";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-family:Oswald;font-size:11px;padding:0 6px;white-space:nowrap}
.p.me{opacity:.4}.p.me .m:after{content:" · you"}
.foot{color:#f7e9ca;text-align:center;font-size:14px;margin:14px 14px 0;line-height:1.4}.foot b{color:var(--yellow)}
</style>
<div class=banner><h1>🗳️ VOTE NOW! · 2 TO CATCH</h1><div class=count>0:19</div><div class=bar><i></i></div></div>
<div class=hint>Tap who hid a word. Change it any time before 0:00.</div>
<div class=g id=g></div>
<div class=foot>Or type the number in chat: <b>2</b><br><b>!vote cydshop</b> works too</div>
<script>document.getElementById('g').innerHTML=NM.map((n,i)=>'<div class="p'+(i==1?' sel':'')+(i==2?' me':'')+'"><span class=n>'+(i+1)+'</span><div class=a style=background:'+AV[i]+'></div><div class=m>'+n+'</div></div>').join('')</script>
