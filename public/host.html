<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sus Word Host</title>
    <link rel="stylesheet" href="/host.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">STREAMER DESK</p>
          <h1>SUS WORD CONTROL</h1>
        </div>
        <span id="connection">CONNECTING</span>
      </header>

      <section class="status-card">
        <div><span>PHASE</span><strong id="phase">—</strong></div>
        <div><span>ROUND</span><strong id="round">—</strong></div>
        <div><span>TIME</span><strong id="timer">—</strong></div>
      </section>

      <nav aria-label="Game controls">
        <button data-action="start">Start</button>
        <button data-action="go">Go</button>
        <button data-action="vote">Vote now</button>
        <button data-action="next">Next</button>
        <button data-action="end" class="secondary">End</button>
        <button data-action="reset" class="danger">Reset</button>
      </nav>
      <section class="voice-panel" aria-labelledby="voice-title">
        <div class="voice-control">
          <span id="mic-dot" class="mic-dot" aria-hidden="true"></span>
          <button id="mic-toggle" type="button" aria-pressed="false">🎙 Mic</button>
          <strong id="voice-title">STREAMER VOICE</strong>
        </div>
        <p id="voice-interim" class="voice-interim" aria-live="polite">Mic is off.</p>
        <p id="voice-help" class="voice-help"></p>
        <p id="voice-roster-warning" class="voice-warning" hidden>You are not in the game yet: type !join and claim your card</p>
      </section>
      <p id="action-result" role="status"></p>

      <div class="grid">
        <section class="panel">
          <h2>PLAYERS <span id="player-total"></span></h2>
          <div id="players" class="players"></div>
        </section>
        <section class="panel">
          <h2>PLAYER CARD</h2>
          <a id="card-url" target="_blank" rel="noreferrer"></a>
          <button id="copy-card" class="copy">Copy card URL</button>
          <details>
            <summary>Live state JSON</summary>
            <pre id="state-json"></pre>
          </details>
        </section>
      </div>
    </main>
    <script type="module" src="/host.js"></script>
  </body>
</html>
